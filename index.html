function makeTournament(){let team=$('tmode').value==='team',names=team?[...new Set(S.players.map(p=>p.team.trim()).filter(Boolean))]:S.players.map(p=>p.name);if(names.length<2)return alert('At least two contestants or named teams required');if(new Set(names).size!==names.length)return alert('Use unique contestant names');S.tournament={name:$('tname').value.trim()||'Championship',rounds:[pair(names)],champion:null};update()}
function pair(names){let a=[];for(let i=0;i<names.length;i+=2)a.push({a:names[i],b:names[i+1]||null,w:names[i+1]?null:names[i]});return a}
function chooseMatch(r,i,w){let t=S.tournament,m=t.rounds[r][i];if(r!==t.rounds.length-1||m.w)return;m.w=w===0?m.a:m.b;if(t.rounds[r].every(x=>x.w)){let winners=t.rounds[r].map(x=>x.w);if(winners.length===1)t.champion=winners[0];else t.rounds.push(pair(winners))}update()}
function tournaments(){let t=S.tournament;return `<div class="panel"><h2>Championship arena</h2><input id="tname" placeholder="Tournament name"><select id="tmode"><option value="solo">Individuals</option><option value="team">Teams</option></select><button onclick="if(!S.tournament||confirm('Replace tournament?'))makeTournament()">Create bracket</button></div>${t?`<div class="panel"><h2>${esc(t.name)}</h2>${t.champion?`<h2 class="gold">🏆 ${esc(t.champion)}</h2>`:''}<div class="grid">${t.rounds.map((r,j)=>`<div><h3>Round ${j+1}</h3>${r.map((m,i)=>`<div class="panel"><button style="width:100%" ${m.w?'disabled':''} onclick="chooseMatch(${j},${i},0)">${esc(m.a)} ${m.w===m.a?'✓':''}</button><button style="width:100%" ${m.w||!m.b?'disabled':''} onclick="chooseMatch(${j},${i},1)">${esc(m.b||'Bye')} ${m.w===m.b?'✓':''}</button></div>`).join('')}</div>`).join('')}</div></div>`:''}`}
function powerPanel(){return `<div class="panel"><h3>Power-ups & achievements</h3>${S.players.map(p=>`<div class="player" style="flex-wrap:wrap"><div class="grow">${esc(p.name)}<br><small>${p.wins} wins · ${p.badges.map(esc).join(' · ')}</small></div>${['double','shield','freeze'].map(k=>`<button ${!p.powers[k]?'disabled':''} onclick="usePower(${p.id},'${k}')">${k} (${p.powers[k]})</button>`).join('')}<button onclick="refill(${p.id})">Refill</button></div>`).join('')}<small>Double: next positive award · Shield: next penalty · Freeze: pause timer</small></div>`}
function refill(id){let p=S.players.find(p=>p.id===id);snapshot();p.powers={double:1,shield:1,freeze:1};update()}
function usePower(id,k){let p=S.players.find(p=>p.id===id);if(!p?.powers[k])return;if(k==='freeze'&&!S.round?.running)return alert('No running timer');if(k!=='freeze'&&p[k+'Armed'])return alert('Already armed');snapshot();p.powers[k]--;if(k==='freeze')pause();else{p[k+'Armed']=true;update()}}
function soundboard(){return `<div class="panel"><h3>Soundboard</h3><div class="row">${[['win','Victory'],['end','Wrong answer'],['spin','Suspense'],['tick','Buzzer'],['applause','Applause'],['dramatic','Dramatic sting']].map(([k,n])=>`<button onclick="tone('${k}')">♪ ${n}</button>`).join('')}</div><small>Original synthesized cues; capture host audio in your streaming software.</small></div>`}
function broadcastSettings(){return `<div class="panel"><h3>Broadcast appearance</h3><div class="row"><label>Title <input value="${esc(S.settings.broadcastTitle)}" onchange="S.settings.broadcastTitle=this.value;update()"></label><label>Accent <input type="color" value="${esc(S.settings.accent)}" onchange="S.settings.accent=this.value;update()"></label><label><input type="checkbox" ${S.settings.showScores?'checked':''} onchange="S.settings.showScores=this.checked;update()"> Show leaderboard</label><label><input type="checkbox" ${S.settings.showTeams?'checked':''} onchange="S.settings.showTeams=this.checked;update()"> Show teams</label></div></div>`}

let audioCtx,lastTick=-1;function tone(kind='tick'){if(aud||!S.settings.sound)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let notes=kind==='applause'?[330,440,550,660,440,550,660,880]:kind==='dramatic'?[130,130,196,262]:kind==='win'?[523,659,784,1047]:kind==='end'?[330,220]:kind==='spin'?[440,550]:[880];notes.forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.12;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(S.settings.volume/100*.15,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.2)})}catch{}}
function showRules(){return `<div class="panel"><h3>Showtime controls</h3><div class="row"><label><input type="checkbox" ${S.settings.sound?'checked':''} onchange="S.settings.sound=this.checked;save();tone()"> Sound effects</label><label>Volume <input type="range" min="0" max="100" value="${S.settings.volume}" onchange="S.settings.volume=+this.value;save();tone()"></label><label><input type="checkbox" ${S.settings.celebrate?'checked':''} onchange="S.settings.celebrate=this.checked;save()"> Victory confetti</label><label><input type="checkbox" ${S.settings.autoReveal?'checked':''} onchange="S.settings.autoReveal=this.checked;save()"> Reveal at timeout</label><label>Frenzy seconds <input type="number" min="3" max="60" value="${S.settings.frenzy}" onchange="S.settings.frenzy=Math.max(3,Math.min(60,+this.value||5));save()"></label></div><p>Wheel segments (exactly 8, separated by |)</p><input style="width:100%" value="${esc(S.settings.wheelItems)}" onchange="if(this.value.split('|').length===8){S.settings.wheelItems=this.value;save()}else{alert('Enter exactly 8 segments');this.value=S.settings.wheelItems}"><p style="margin-top:12px">Mystery box points (6 comma-separated numbers)</p><input style="width:100%" value="${esc(S.settings.boxRewards)}" onchange="if(this.value.split(',').length===6&&this.value.split(',').every(x=>x.trim()&&Number.isFinite(+x))){S.settings.boxRewards=this.value;save()}else{alert('Enter six numbers');this.value=S.settings.boxRewards}"><p class="muted">Shortcuts: Space = pause/resume · R = reveal · N = next round</p></div>`}
function confetti(){return S.settings.celebrate?`<div class="confetti" aria-hidden="true">${Array.from({length:32},(_,i)=>`<i style="--x:${(i*37)%100}%;--delay:${(i%8)*.07}s;--c:${['#e6c17c','#9566e0','#e58fb8','#fff'][i%4]}"></i>`).join('')}</div>`:''}
window.addEventListener('keydown',e=>{if(aud||tab!=='Play'||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)||e.repeat||e.ctrlKey||e.metaKey)return;if(e.code==='Space'){e.preventDefault();pause()}if(e.key.toLowerCase()==='r')reveal();if(e.key.toLowerCase()==='n')start()});

function pool(){return S.game===0?S.celebs.flatMap(c=>c.images.map(m=>({q:'Who is this celebrity?',qFr:'Qui est cette célébrité ?',a:c.name,aFr:c.name,extra:c.hint||'',aliases:c.aliases||'',media:m}))):S.library[S.game]||[]}function selectGame(i){S.game=i;S.round=null;tab='Play';update()}function start(){let type=G[S.game][2],p=pool(),used=S.used[S.game]||[],available=p.map((_,i)=>i).filter(i=>!used.includes(i));if(!available.length){used=[];available=p.map((_,i)=>i)}let idx=available[Math.floor(Math.random()*available.length)],item=p[idx];if(!item&&!['wheel','boxes','bingo'].includes(type)){alert('Add content in Library first.');return}if(item)S.used[S.game]=[...used,idx];lastTick=-1;tone("spin");let d=S.game===2?S.settings.frenzy:S.settings.duration;S.round={item:item||{q:G[S.game][0],a:''},duration:d,left:d,end:Date.now()+d*1000,running:!['wheel','boxes','bingo','board'].includes(type),revealed:false,winner:'',result:'',opened:[],called:[],cells:[],reward:S.settings.boxRewards.split(",").map(Number).sort(()=>Math.random()-.5)};update()}function remaining(){let r=S.round;return r?Math.max(0,r.running?Math.ceil((r.end-Date.now())/1000):r.left):0}function pause(){let r=S.round;if(!r)return;if(r.running){r.left=remaining();r.running=false}else if(r.left>0&&!r.revealed){r.end=Date.now()+r.left*1000;r.running=true}update()}function reveal(){let r=S.round;if(!r)return;r.left=remaining();r.running=false;r.revealed=true;update()}function award(id){let r=S.round;if(!r||r.winner)return;let p=S.players.find(p=>p.id===id);if(!p)return;let n=S.settings.mode==='speed'?Math.max(10,Math.round(S.settings.points*remaining()/r.duration)):S.settings.points;if(['wheel','boxes'].includes(G[S.game][2]))n=G[S.game][2]==='boxes'?(r.reward[r.opened.at(-1)]||0):({' +100 points':100,'+100 points':100,'Lose 25 points':-25}[r.result]||0);if(G[S.game][2]==='risk')n=Math.min(p.score,Math.max(0,Number($('stake')?.value)||0));snapshot();if(n>0&&p.doubleArmed){n*=2;p.doubleArmed=false}if(n<0&&p.shieldArmed){n=0;p.shieldArmed=false}p.score=Math.max(0,p.score+n);if(n>0){p.wins++;if(p.wins===1&&!p.badges.includes('First win'))p.badges.push('First win');if(p.wins>=5&&!p.badges.includes('Five wins'))p.badges.push('Five wins')}r.winner=p.name+' '+(n>=0?'+':'')+n;tone(n>=0?'win':'end');r.left=remaining();r.running=false;r.revealed=true;update()}function loseStake(id){let p=S.players.find(x=>x.id===id),r=S.round;if(!p||!r||r.winner)return;let n=Math.min(p.score,Math.max(0,Number($('stake')?.value)||0));snapshot();if(p.shieldArmed){n=0;p.shieldArmed=false}p.score-=n;r.winner=p.name+' −'+n;reveal()}function action(kind,i){let r=S.round;if(!r)return;if(kind==='wheel'){let options=S.settings.wheelItems.split('|');tone('spin');let j=Math.floor(Math.random()*options.length);r.result=options[j];r.spin=(r.spin||0)+720+((360-j*45-22.5-(r.spin||0)%360+360)%360)}if(kind==='box'&&!r.opened.includes(i)){r.opened.push(i);r.result='Box '+(i+1)+': '+r.reward[i]+' points'}if(kind==='bingo'){let a=Array.from({length:75},(_,i)=>i+1).filter(n=>!r.called.includes(n));if(a.length){let n=a[Math.floor(Math.random()*a.length)];r.called.push(n);r.result=String(n)}}if(kind==='board'&&!r.cells.includes(i)){r.cells.push(i);r.item=pool()[i%pool().length];r.revealed=false;r.winner='';r.duration=S.settings.duration;r.end=Date.now()+r.duration*1000;r.running=true;r.left=r.duration}if(kind==='survey'){if(!r.opened.includes(i))r.opened.push(i)}update()}
function stage(){let r=S.round,g=G[S.game],type=g[2];if(!r)return `<div class="stage"><div style="font-size:60px">${g[1]}</div><h2>${g[0]}</h2><p class="muted">Ready for the next challenge</p></div>`;let item=r.item,remain=remaining(),progress=r.revealed?100:Math.max(2,100*(1-remain/r.duration)),style=S.settings.style;let imageStyle=r.revealed?'':style==='vertical'?`clip-path:inset(0 ${(100-progress)/2}%)`:style==='strip'?`clip-path:inset(${(100-progress)/2}% 0)`:`clip-path:circle(${progress*.75}% at 50% 50%)`;if(!r.revealed&&(S.game===21||style==='blur'))imageStyle=`filter:blur(${(100-progress)*.22}px)`;if(S.game===22&&!r.revealed)imageStyle='filter:brightness(0) drop-shadow(0 0 2px #ae8fe8)';if(style==='mosaic'&&S.game!==22)imageStyle='';let body='';if(type==='image')body=`<div class="photo"><img src="${esc(item.media)}" style="${imageStyle}" alt="Mystery image">${style==='mosaic'&&!r.revealed?`<div class="mosaic">${Array.from({length:64},(_,i)=>`<i data-tile="${i}" style="opacity:${(i*37)%64<progress*.64?0:1}"></i>`).join('')}</div>`:''}</div>`;else if(type==='wheel')body=`<div class="wheel" style="transform:rotate(${r.spin||0}deg)">${S.settings.wheelItems.split('|').map((v,i)=>`<b class="wheel-label" style="transform:rotate(${i*45+22.5}deg) translateY(-78px)">${esc(v)}</b>`).join('')}<span>✦</span></div><div class="pointer">▼</div><div class="big">${esc(r.result||'Spin the wheel!')}</div>${aud?'':'<button onclick="action(\'wheel\')">Spin</button>'}`;else if(type==='boxes')body=`<div class="tiles">${r.reward.map((v,i)=>`<button ${aud?'disabled':''} onclick="action('box',${i})">${r.opened.includes(i)?v+' pts':'🎁 '+(i+1)}</button>`).join('')}</div><h3>${esc(r.result)}</h3>`;else if(type==='bingo')body=`<div class="big">${esc(r.result||'Ready')}</div><div class="tiles">${Array.from({length:75},(_,i)=>`<span style="padding:5px;background:${r.called.includes(i+1)?'#7545bf':'#21192f'}">${i+1}</span>`).join('')}</div>${aud?'':'<button onclick="action(\'bingo\')">Draw number</button>'}`;else if(type==='board')body=`<div class="tiles">${pool().map((_,i)=>`<button ${aud||r.cells.includes(i)?'disabled':''} onclick="action('board',${i})">${r.cells.includes(i)?'✓':(i%5+1)*100}</button>`).join('')}</div>${r.cells.length?`<div class="big">${localized(item,"q")}</div>`:''}`;else if(type==='secret')body=`<div class="big">${aud?'Secret challenge in progress':esc(item.q)}</div>`;else {body=`<div class="big">${localized(item,"q")}</div>`;if(type==='audio'&&item.media)body+=`<audio controls src="${esc(item.media)}"></audio>`;if(type==='choice')body+=`<div class="grid">${item.extra.split('|').map((x,i)=>`<div class="panel">${pairText(x,(item.extraFr||'').split('|')[i])}</div>`).join('')}</div>`;if(type==='survey')body+=item.a.split('|').map((x,i)=>`<button ${aud?'disabled':''} onclick="action('survey',${i})">${r.opened.includes(i)||r.revealed?pairText(x,(item.aFr||'').split('|')[i]):'Answer '+(i+1)}</button>`).join('')};return `<div class="stage"><small>${g[0].toUpperCase()}</small><div class="timer" id="clock">${remain}s</div><div class="bar"><i id="progress" style="width:${progress}%"></i></div>${body}${r.hintShown&&type==='image'?`<p class="gold">Hint: ${esc(item.extra||'No hint available')}</p>`:''}${r.revealed?`<h2 class="gold">${localized(item,"a")}</h2>`:''}${r.winner?`${confetti()}<div class="big gold winner">🏆 ${esc(r.winner)}</div>`:''}</div>`}
function play(){let r=S.round;return `<div class="row"><h2 class="grow">${G[S.game][1]} ${G[S.game][0]}</h2><button onclick="go('Library');lib=S.game;render()">Edit content</button></div><div class="layout"><div>${stage()}<div class="panel"><div class="row"><button class="primary" onclick="start()">${r?'Next round':'Start round'}</button><button onclick="pause()">${r?.running?'Pause':'Resume'}</button><button onclick="reveal()">Reveal answer</button><button onclick="if(S.round){S.round.left=remaining()+10;S.round.end=Date.now()+S.round.left*1000;update()}">+10s</button></div>${r?`<p style="margin-top:12px">Host answer: <b class="gold">${localized(r.item,"a")}</b></p><p class="muted">${localized(r.item,"extra")} ${r.item.aliases?' · Accepted: '+esc(r.item.aliases):''}</p>${G[S.game][2]==='risk'?'<label>Stake <input id="stake" type="number" min="0" value="100"></label>':''}<div class="row">${G[S.game][2]==='risk'?S.players.map(p=>`<button onclick="loseStake(${p.id})">✗ ${esc(p.name)}</button>`).join(''):''}${S.players.map(p=>`<button onclick="award(${p.id})" ${r.winner?'disabled':''}>✓ ${esc(p.name)}</button>`).join('')}</div>`:''}</div></div><div>${scores()}<div class="panel"><h3>Game master</h3><div class="row"><button onclick="S.settings.points*=2;update()">Double points</button><button onclick="S.settings.points=100;update()">Reset points</button><button onclick="alert(S.players.length?S.players[Math.floor(Math.random()*S.players.length)].name:'Add players first')">Random player</button><button onclick="if(S.round){S.round.hintShown=true;update()}">Hint</button></div></div></div></div>`}
function library(){let list=S.library[lib]||[],c=lib===0;return `<h2>Content library</h2><div class="row panel"><select onchange="lib=+this.value;edit=-1;render()">${G.map((g,i)=>`<option value="${i}" ${i===lib?'selected':''}>${g[0]}</option>`).join('')}</select><button onclick="edit=-1;render()">New entry</button>${c?'<button onclick="window.open(\'https://commons.wikimedia.org/\')">Find licensed images</button>':''}</div><div class="layout"><div class="panel"><h3>${edit<0?'Add':'Edit'} ${c?'celebrity':'challenge'}</h3>${c?`<input id="q" placeholder="Celebrity name" value="${esc(S.celebs[edit]?.name)}"><textarea id="media" placeholder="Image URLs, one per line">${esc(S.celebs[edit]?.images.join('\n'))}</textarea><input id="extra" placeholder="Hint / category" value="${esc(S.celebs[edit]?.hint)}"><input id="ccat" placeholder="Category" value="${esc(S.celebs[edit]?.category)}"><input id="calias" placeholder="Accepted aliases" value="${esc(S.celebs[edit]?.aliases)}"><select id="cdiff">${['Easy','Mixed','Hard'].map(d=>`<option ${d===(S.celebs[edit]?.difficulty||'Mixed')?'selected':''}>${d}</option>`).join('')}</select>`:`<textarea id="q" placeholder="Question / prompt">${esc(list[edit]?.q)}</textarea><input id="a" placeholder="Answer" value="${esc(list[edit]?.a)}"><textarea id="extra" placeholder="Hint / options separated by |">${esc(list[edit]?.extra)}</textarea><details><summary>French translation / Traduction française</summary><textarea id="qFr" placeholder="Question FR">${esc(list[edit]?.qFr)}</textarea><input id="aFr" placeholder="Réponse FR" value="${esc(list[edit]?.aFr)}"><textarea id="extraFr" placeholder="Indices / choix FR séparés par |">${esc(list[edit]?.extraFr)}</textarea></details><input id="media" placeholder="Image or audio URL" value="${esc(list[edit]?.media)}">`}<p><small>Use images or audio you have permission to broadcast. Direct media URLs required.</small></p><input type="file" accept="${c?'image/*':'image/*,audio/*'}" onchange="upload(this)"><di setInterval(()=>{let r=S.round;if(!r||!r.running)return;let n=remaining();if(!aud&&n===0){r.running=false;r.left=0;r.revealed=S.settings.autoReveal;tone('end');update();return}if(!aud&&n<=5&&n>0&&n!==lastTick){lastTick=n;tone()}if($('clock')){$('clock').textContent=n+'s';$('clock').classList.toggle('urgent',n<=5);}let p=Math.max(2,100*(1-n/r.duration));if($('progress'))$('progress').style.width=p+'%';let im=document.querySelector('.photo img');document.querySelectorAll('[data-tile]').forEach(e=>e.style.opacity=(+e.dataset.tile*37)%64<p*.64?0:1);if(im){let style=S.settings.style;if(style==='mosaic')im.style.clipPath='none';else if(S.game===21||style==='blur')im.style.filter=`blur(${(100-p)*.22}px)`;else if(S.game!==22)im.style.clipPath=style==='vertical'?`inset(0 ${(100-p)/2}%)`:style==='strip'?`inset(${(100-p)/2}% 0)`:`circle(${p*.75}% at 50% 50%)`}},200);render();
</script></body></html>
